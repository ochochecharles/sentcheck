services:
  db:
    image: postgres:16-alpine
    container_name: sentcheck-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sentcheck
    ports:
      - "5434:5432"
    volumes:
      - sentcheck-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentcheck"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sentcheck-pgdata: